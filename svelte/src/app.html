<!doctype html>
<html lang="en">
  <head>
    <title>Anton G Neuhold Jr's Portfolio</title>
    <meta
      name="description"
      content="A portfolio with various projects and social links for the developer Anton G Neuhold Jr."
    />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />

    <!-- Roboto (used throughout the site) is served from static/fonts, one variable font file per
      style covering every weight. The normal style is preloaded since most text uses it. The
      fallback face scales Arial to Roboto's metrics (the values next/font generates for Roboto), so
      text keeps its size when Roboto swaps in. 
      
      As of 9/13/2026 This was faster than loading from Google Fonts.

      The Roboto Fallback is what showed up in the Next.js build as a good fallback. So that is
      where those numbers come from.
    -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/roboto-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: 'Roboto';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('%sveltekit.assets%/fonts/roboto-latin-wght-normal.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Roboto';
        font-style: italic;
        font-weight: 100 900;
        font-display: swap;
        src: url('%sveltekit.assets%/fonts/roboto-latin-wght-italic.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Roboto Fallback';
        src: local('Arial');
        ascent-override: 92.98%;
        descent-override: 24.47%;
        line-gap-override: 0%;
        size-adjust: 99.78%;
      }
    </style>

    <!-- Google tag (gtag.js) for Google Analytics - Deferred loading for better performance -->
    <script>
      // Defer Google Analytics loading until after page is interactive
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-JJX60BKWFQ');

      // Load gtag script after page is interactive
      function loadGoogleAnalytics() {
        const script = document.createElement('script');
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-JJX60BKWFQ';
        script.async = true;
        document.head.appendChild(script);
      }

      // Load after page is interactive, or after 1 second (whichever comes first)
      if (document.readyState === 'complete') {
        setTimeout(loadGoogleAnalytics, 1000);
      } else {
        window.addEventListener('load', () => setTimeout(loadGoogleAnalytics, 1000));
      }
    </script>

    %sveltekit.head%
  </head>

  <body>
    <div>%sveltekit.body%</div>
  </body>
</html>
