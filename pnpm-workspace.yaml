packages:
  - packages/*
  - svelte
  - react

# `sharp` needs its install script to resolve the image binaries used by the
# production build. `esbuild`, which `tsx` uses to run the asset generation
# scripts, needs its install script to verify its platform binary.
# `@parcel/watcher` only backs an optional file watcher, so it is left unbuilt.
allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  sharp: true

# Hold back any package published within the last 7 days, so a freshly
# released bad version can't sneak into installs/updates.
# 7 * 24 * 60 minutes = 10080.
minimumReleaseAge: 10080

minimumReleaseAgeExclude:
  - '@aneuhold/*'
